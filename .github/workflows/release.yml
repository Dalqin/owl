name: Release

# Push a tag such as v0.1.0 to build installers for Linux and Windows
# and attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: Owl ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}

      # The command-line tool ships separately from the desktop installers.
      - name: Build the CLI
        run: cargo build --release -p owl

      - name: Package the CLI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf owl-${{ github.ref_name }}-linux-x86_64.tar.gz -C target/release owl
      - name: Package the CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/owl.exe -DestinationPath owl-${{ github.ref_name }}-windows-x86_64.zip

      - name: Attach the CLI to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" owl-${{ github.ref_name }}-* --clobber
